version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bus_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bus_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:6.0
    container_name: bus_mongodb
    restart: always
    ports:
      - "27018:27017" # Map host 27018 to container 27017
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: bus_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: bus_rabbitmq
    restart: always
    ports:
      - "5672:5672"     # RabbitMQ port
      - "15672:15672"   # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  backend:
    build:
      context: ./backend
    container_name: bus_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/bus_management
      - JWT_SECRET=super_secret_jwt_key_for_smart_bus_system_2026
      - JWT_EXPIRES_IN=7d
      - BREVO_API_KEY=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
      - GEMINI_API_KEY=AQ.Ab8RN6Lh4FK6DiJw0B7BVCK_y_eAqtRFWlGj050VS90huXTKvQ
    depends_on:
      - mongodb
      - redis
      - rabbitmq

  customer-app:
    build:
      context: ./frontend/customer-app
    container_name: bus_customer_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
    container_name: bus_admin_dashboard
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - backend

  gateway:
    image: nginx:alpine
    container_name: bus_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - customer-app
      - admin-dashboard

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
