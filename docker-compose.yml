version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: bus_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: bus_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongodb:
    image: mongo:6.0
    container_name: bus_mongodb
    restart: always
    ports:
      - "27018:27017" # Map host 27018 to container 27017
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7.0-alpine
    container_name: bus_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3.11-management-alpine
    container_name: bus_rabbitmq
    restart: always
    ports:
      - "5672:5672"     # RabbitMQ port
      - "15672:15672"   # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: bus_api_gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:8001
      - USER_SERVICE_URL=http://user-service:8002
      - TRIP_SERVICE_URL=http://trip-service:8003
      - BOOKING_SERVICE_URL=http://booking-service:8004
      - PRICING_SERVICE_URL=http://pricing-service:8005
      - PAYMENT_SERVICE_URL=http://payment-service:8006
      - TRACKING_SERVICE_URL=http://tracking-service:8007
      - NOTIFICATION_SERVICE_URL=http://notification-service:8008
      - REVIEW_SERVICE_URL=http://review-service:8009
    depends_on:
      - auth-service
      - user-service
      - trip-service
      - booking-service

  auth-service:
    build:
      context: ./services/auth-service
    container_name: bus_auth_service
    restart: always
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - MONGO_URI=mongodb://mongodb:27017/bus_management
      - JWT_SECRET=super_secret_jwt_key_for_smart_bus_system_2026
      - JWT_EXPIRES_IN=7d
    depends_on:
      - mongodb

  user-service:
    build:
      context: ./services/user-service
    container_name: bus_user_service
    restart: always
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MONGO_URI=mongodb://mongodb:27017/bus_management
    depends_on:
      - mongodb

  trip-service:
    build:
      context: ./services/trip-service
    container_name: bus_trip_service
    restart: always
    ports:
      - "8003:8003"
    env_file:
      - ./services/trip-service/.env
    environment:
      - PORT=8003
      - MONGO_URI=mongodb://mongodb:27017/bus_management
    depends_on:
      - mongodb

  booking-service:
    build:
      context: ./services/booking-service
    container_name: bus_booking_service
    restart: always
    ports:
      - "8004:8004"
    env_file:
      - ./services/booking-service/.env
    environment:
      - PORT=8004
      - MONGO_URI=mongodb://mongodb:27017/bus_management
    depends_on:
      - mongodb

  pricing-service:
    build:
      context: ./services/pricing-service
    container_name: bus_pricing_service
    restart: always
    ports:
      - "8005:8005"
    environment:
      - PORT=8005
    depends_on:
      - redis

  payment-service:
    build:
      context: ./services/payment-service
    container_name: bus_payment_service
    restart: always
    ports:
      - "8006:8006"
    environment:
      - PORT=8006

  tracking-service:
    build:
      context: ./services/tracking-service
    container_name: bus_tracking_service
    restart: always
    ports:
      - "8007:8007"
    environment:
      - PORT=8007
    depends_on:
      - redis

  notification-service:
    build:
      context: ./services/notification-service
    container_name: bus_notification_service
    restart: always
    ports:
      - "8008:8008"
    environment:
      - PORT=8008
    depends_on:
      - rabbitmq

  review-service:
    build:
      context: ./services/review-service
    container_name: bus_review_service
    restart: always
    ports:
      - "8009:8009"
    environment:
      - PORT=8009
    depends_on:
      - mongodb

  customer-app:
    build:
      context: ./frontend/customer-app
    container_name: bus_customer_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
    container_name: bus_admin_dashboard
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - api-gateway

volumes:
  mysql_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
