version: '3.8'

# ============================================================
# DOCKER COMPOSE - HỆ THỐNG QUẢN LÝ NHÀ XE AN BÌNH LINES
# Dành cho môi trường phát triển LOCAL (dev/KLTN demo)
#
# Lệnh khởi động toàn bộ: docker-compose up -d
# Lệnh tắt:               docker-compose down
# ============================================================

services:
  # -----------------------------------------------------------
  # 1. CSDL chính: MongoDB (toàn bộ dữ liệu hệ thống)
  #    Khi up host Render: thay bằng MongoDB Atlas (miễn phí)
  # -----------------------------------------------------------
  mongodb:
    image: mongo:6.0
    container_name: bus_mongodb
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  # -----------------------------------------------------------
  # 2. Cache RAM: Redis (lưu tọa độ GPS xe theo thời gian thực)
  #    Khi up host Render: tự động fallback sang In-Memory cache
  #    nếu không có Redis (không ảnh hưởng chức năng)
  # -----------------------------------------------------------
  redis:
    image: redis:7.0-alpine
    container_name: bus_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # -----------------------------------------------------------
  # 3. Backend API (Node.js / Express)
  # -----------------------------------------------------------
  backend:
    build:
      context: ./backend
    container_name: bus_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017/bus_management
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_jwt_key_for_smart_bus_system_2026
      - JWT_EXPIRES_IN=7d
      - BREVO_API_KEY=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
      - GEMINI_API_KEY=AQ.Ab8RN6Lh4FK6DiJw0B7BVCK_y_eAqtRFWlGj050VS90huXTKvQ
      - PAYOS_CLIENT_ID=4d3bc19d-cb78-4cdf-8fc8-1ceab7ea70d5
      - PAYOS_API_KEY=2912e193-a4ec-4109-a39d-f2ea2a28b3e8
      - PAYOS_CHECKSUM_KEY=67630b90e08f035cdb3898d01962133fe4b79ff463ef14d6610b31e828c69a9e
      - FRONTEND_URL=http://localhost:3000
      - ADMIN_URL=http://localhost:3001
    depends_on:
      - mongodb
      - redis

  # -----------------------------------------------------------
  # 4. Frontend khách hàng (React)
  # -----------------------------------------------------------
  customer-app:
    build:
      context: ./frontend/customer-app
      args:
        - REACT_APP_API_URL=http://localhost:8000
    container_name: bus_customer_app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # -----------------------------------------------------------
  # 5. Frontend quản trị (React)
  # -----------------------------------------------------------
  admin-dashboard:
    build:
      context: ./frontend/admin-dashboard
      args:
        - REACT_APP_API_URL=http://localhost:8000
    container_name: bus_admin_dashboard
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - backend

  # -----------------------------------------------------------
  # 6. API Gateway / Reverse Proxy (Nginx - cổng 80)
  # -----------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: bus_gateway
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - customer-app
      - admin-dashboard

volumes:
  mongo_data:
  mongo_data:
  redis_data:
  rabbitmq_data:
